---
# Create or update a server configuration item (cmdb_ci_server)
# in the ServiceNow CMDB for each VM in cmdb_target.
#
# Imported at the end of provision-vm.yml (cmdb_target defaults to the
# new_vms group it builds). Can also run on its own against VMs that are in
# an AAP inventory: set cmdb_target to a host or group name.
#
# Job template requirements (see README):
#   - Credential: custom "ServiceNow" (aap/credential-type-servicenow.yml)
#     -> SN_HOST / SN_API_KEY env vars
#   - Credential: Machine (the facts come from the VM, dmidecode needs sudo)
# The API key's user needs read/write access to cmdb_ci_server. Access to a
# parent table does not cover its child classes, so the CI is created in
# cmdb_ci_server itself, not cmdb_ci_linux_server. Set snow_cmdb_register: false to skip this playbook.
#
# The CI is matched on serial_number: OpenShift Virtualization stores the
# SMBIOS serial on the VirtualMachine, so it survives restarts, and a VM
# recreated under the same name is a new machine with a new CI.

- name: Register the VMs in the ServiceNow CMDB
  hosts: "{{ cmdb_target | default('new_vms') }}"
  gather_facts: false
  become: true

  vars:
    snow_host: "{{ lookup('ansible.builtin.env', 'SN_HOST') | trim | regex_replace('/+$', '') }}"
    snow_api_key: "{{ lookup('ansible.builtin.env', 'SN_API_KEY') | trim }}"
    snow_headers:
      Accept: application/json
      x-sn-apikey: "{{ snow_api_key }}"
    snow_cmdb_table: cmdb_ci_server
    snow_cmdb_url: "{{ snow_host }}/api/now/table/{{ snow_cmdb_table }}"
    # Reference fields (manufacturer -> core_company, model_id -> cmdb_model)
    # are sent by name and resolved by ServiceNow; a name with no matching or
    # readable record leaves the field empty. false leaves them out.
    snow_cmdb_references: true
    snow_cmdb_manufacturer: "{{ ansible_facts['system_vendor'] }}"
    snow_cmdb_model: "{{ ansible_facts['product_name'] }}"
    snow_cmdb_comments: >-
      Provisioned by Ansible Automation Platform{{ (' job ' ~ tower_job_id) if tower_job_id is defined else '' }}
      on OpenShift Virtualization ({{ vm_namespace | default('rhel-vms') }}/{{ inventory_hostname }}).
    # ip_address: the guest only sees the masquerade address (10.0.2.2); the
    # pod IP in ansible_host is the address that reaches the VM.
    cpu_vendors:
      GenuineIntel: Intel
      AuthenticAMD: AMD

  tasks:
    - name: Skip when CMDB registration is disabled
      ansible.builtin.meta: end_play
      when: not (snow_cmdb_register | default(true) | bool)

    - name: Check the ServiceNow credential
      ansible.builtin.assert:
        that:
          - snow_host | length > 0
          - snow_api_key | length > 0
        fail_msg: >-
          Attach the ServiceNow credential to the job template, or set
          snow_cmdb_register: false to skip CMDB registration.
        quiet: true
      run_once: true

    - name: Gather hardware facts
      ansible.builtin.setup:
        gather_subset: [hardware, virtual, network]

    # One expression, so numbers and booleans keep their type in the JSON.
    # Empty values (no DNS domain, no CPU speed in a VM) are left out.
    - name: Build the CI payload
      ansible.builtin.set_fact:
        cmdb_ci_payload: >-
          {{ {
               'name': inventory_hostname,
               'serial_number': 'SNDVTLNUX1234',
               'manufacturer': snow_cmdb_manufacturer,
               'model_id': snow_cmdb_model,
               'comments': snow_cmdb_comments,
               'host_name': ansible_facts['hostname'],
               'os_domain': ansible_facts['domain'],
               'dns_domain': ansible_facts['domain'],
               'os': 'Linux Red Hat',
               'os_version': 'Red Hat Enterprise Linux ' ~ ansible_facts['distribution_version'],
               'os_service_pack': 'Update ' ~ (ansible_facts['distribution_version'].split('.') + ['0'])[1],
               'ip_address': ansible_host | default(ansible_facts['default_ipv4']['address']),
               'ram': ansible_facts['memtotal_mb'] | int,
               'cpu_manufacturer': cpu_vendors[cpu_vendor] | default(cpu_vendor),
               'cpu_type': cpu_model,
               'cpu_speed': ((cpu_ghz | float) * 1000) | int if cpu_ghz else none,
               'cpu_count': ansible_facts['processor_count'] | int,
               'cpu_core_count': ansible_facts['processor_cores'] | int,
               'virtual': true,
             } | dict2items | rejectattr('value', 'in', ['', none, 'NA'])
               | rejectattr('key', 'in', [] if snow_cmdb_references | bool else ['manufacturer', 'model_id'])
               | items2dict }}
      vars:
        cpu_vendor: "{{ ansible_facts['processor'][1] | default('') }}"
        cpu_model: "{{ ansible_facts['processor'][2] | default('') }}"
        cpu_ghz: "{{ cpu_model | regex_search('@ *([0-9.]+) *GHz', '\\1') | default([], true) | first | default('') }}"

    - name: Check the VM has a serial number
      ansible.builtin.assert:
        that: cmdb_ci_payload.serial_number is defined
        fail_msg: "No SMBIOS serial number on {{ inventory_hostname }}: cannot match a CI."
        quiet: true

    #The API key is a plain header, which Ansible does not mask, so the API
    #calls are no_log and the asserts after them report errors instead.
    - name: Look up an existing CI by serial number
      ansible.builtin.uri:
        url: >-
          {{ snow_cmdb_url }}?sysparm_limit=1&sysparm_fields=sys_id,name&sysparm_query={{
          ('serial_number=' ~ cmdb_ci_payload.serial_number) | urlencode }}
        method: GET
        headers: "{{ snow_headers }}"
      register: cmdb_lookup
      delegate_to: localhost
      become: false
      failed_when: false
      no_log: true

    - name: Check the lookup worked
      ansible.builtin.assert:
        that: cmdb_lookup.status == 200
        fail_msg: >-
          {{ 'ServiceNow rejected the API key (check the key and the API Access Policy).'
             if cmdb_lookup.status == 401 else
             'The API key has no read access to ' ~ snow_cmdb_table ~ '.'
             if cmdb_lookup.status == 403 else
             'CMDB lookup failed: HTTP ' ~ cmdb_lookup.status }}
          {{ cmdb_lookup.json.error | default({}) | to_json if cmdb_lookup.status != 200 else '' }}
        quiet: true

    - name: Create or update the CI
      ansible.builtin.uri:
        url: >-
          https://eraneossecurity.service-now.com/api/denbv/azure_link_demo/create_ci
        method: "{{ 'PATCH' if cmdb_existing else 'POST' }}"
        headers: "{{ snow_headers }}"
        body_format: json
        body: "{{ cmdb_ci_payload }}"
      vars:
        cmdb_existing: "{{ cmdb_lookup.json.result | first | default({}) }}"
      register: cmdb_write
      delegate_to: localhost
      become: false
      changed_when: true
      failed_when: false
      no_log: true

    - name: Report the CI
      ansible.builtin.assert:
        that: cmdb_write.status in [200, 201]
        fail_msg: >-
          Writing the CI for {{ inventory_hostname }} to {{ snow_cmdb_table }} failed: HTTP {{ cmdb_write.status }}
          {{ '(no write access to ' ~ snow_cmdb_table ~ ', or to a field in the payload)' if cmdb_write.status == 403 else '' }}
          {{ cmdb_write.json.error | default({}) | to_json }}
        success_msg: >-
          {{ 'Created' if cmdb_write.status == 201 else 'Updated' }} CI {{ cmdb_write.json.result.name }}:
          {{ snow_host }}/nav_to.do?uri={{ snow_cmdb_table }}.do?sys_id={{ cmdb_write.json.result.sys_id }}
