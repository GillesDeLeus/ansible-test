---
# Report the CVEs Red Hat Satellite knows about to ServiceNow: one vulnerable
# item (sn_vul_vulnerable_item) per CVE per host, linked to the host's CMDB CI.
# Meant to run on an AAP schedule (e.g. every 15 minutes), so Satellite
# effectively reports to ServiceNow on its own.
#
# Agentless: everything comes from the Satellite API (no SSH to the VMs, no
# AAP inventory of the VMs needed). Every host registered to Satellite is
# covered, including new ones, except the Satellite itself.
#   Satellite host -> applicable security errata and their CVEs
#                  -> SMBIOS serial (reported by subscription-manager)
#   ServiceNow     -> CMDB CI by serial (by name when Satellite has no serial)
#                  -> vulnerability record per CVE (created when missing)
#                  -> vulnerable items that do not exist yet for that CI
#                  -> open vulnerable items whose CVE Satellite no longer
#                     reports for the host are set to Resolved (patched)
# Satellite only lists CVEs an erratum fixes (fix available); Insights also
# lists CVEs without a fix.
#
# Job template requirements:
#   - Credential: custom "Red Hat Satellite" -> satellite_admin_password
#   - Credential: custom "ServiceNow" (aap/credential-type-servicenow.yml)
#   - Inventory with localhost (no Machine credential needed)
#   - Extra var: satellite_fqdn (or satellite_api_url)
# Optional:
#   satellite_cve_host_search   Satellite host search to limit the hosts,
#                               e.g. 'name = rhel-sat-1' (default: all hosts)
#   satellite_cve_errata_types  default [security]
#   snow_close_fixed_items      default true; false only creates items
#   satellite_cves_sync: false  skip

- name: Find the hosts registered to Satellite
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    sat_api: "{{ satellite_api_url | default('https://' ~ (satellite_fqdn | default(''))) }}"
    sat_org: "{{ satellite_organization | default('Devoteam Demo') }}"
    host_search: >-
      {{ (['organization = "' ~ sat_org ~ '"']
          + ([satellite_cve_host_search] if satellite_cve_host_search | default('') | length > 0 else []))
         | join(' and ') }}

  tasks:
    # Ending this play before add_host leaves the next play with no hosts.
    - name: Skip when the CVE sync is disabled
      ansible.builtin.meta: end_play
      when: not (satellite_cves_sync | default(true) | bool)

    - name: Check the credentials
      ansible.builtin.assert:
        that:
          - satellite_fqdn is defined or satellite_api_url is defined
          - satellite_admin_password is defined
          - lookup('ansible.builtin.env', 'SN_HOST') | length > 0
          - lookup('ansible.builtin.env', 'SN_API_KEY') | length > 0
        fail_msg: "Set satellite_fqdn and attach the Red Hat Satellite and ServiceNow credentials."
        quiet: true

    - name: List the hosts in Satellite
      ansible.builtin.uri:
        url: "{{ sat_api }}/api/hosts?per_page=1000&thin=true&search={{ host_search | urlencode }}"
        user: admin
        password: "{{ satellite_admin_password }}"
        force_basic_auth: true
        validate_certs: false
      register: sat_hosts

    # The Satellite registers itself as a host; it is infrastructure, not a
    # demo VM.
    - name: Add each host as a local (API-only) target
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: satellite_cve_hosts
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        sat_host_id: "{{ item.id }}"
      loop: "{{ sat_hosts.json.results | rejectattr('name', 'eq', satellite_fqdn | default('')) | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Hosts to report
      ansible.builtin.debug:
        msg: "{{ groups['satellite_cve_hosts'] | default([]) | length }} host(s): {{ groups['satellite_cve_hosts'] | default([]) | join(', ') }}"

- name: Report each host's CVEs to ServiceNow
  hosts: satellite_cve_hosts
  gather_facts: false

  vars:
    sat_api: "{{ satellite_api_url | default('https://' ~ satellite_fqdn) }}"
    satellite_cve_errata_types: [security]
    sat_errata_search: >-
      {{ satellite_cve_errata_types | map('regex_replace', '^(.*)$', 'type = \1') | join(' or ') }}

    snow_host: "{{ lookup('ansible.builtin.env', 'SN_HOST') | trim | regex_replace('/+$', '') }}"
    snow_api_key: "{{ lookup('ansible.builtin.env', 'SN_API_KEY') | trim }}"
    snow_headers:
      Accept: application/json
      x-sn-apikey: "{{ snow_api_key }}"
    snow_api: "{{ snow_host }}/api/now/table"
    snow_cmdb_table: cmdb_ci_server
    snow_cve_table: sn_vul_nvd_entry
    snow_vi_table: sn_vul_vulnerable_item
    # A vulnerable item must point to a vulnerability record. CVEs the NVD
    # import has not brought in yet get a minimal record (id + erratum title);
    # false skips and lists them instead. Needs create access to sn_vul_nvd_entry.
    snow_create_missing_cves: true
    snow_query_batch: 50
    # Close open items on the CI whose CVE Satellite no longer reports. This
    # covers every open item on the CI, also ones not created by this sync.
    snow_close_fixed_items: true
    # Also close open items on the CI that are linked to no vulnerability at
    # all (empty or dangling link, e.g. a CVE record created by this sync that
    # ServiceNow later removed). They cannot be acted on.
    snow_close_orphaned_items: true
    # Choice label, not number (sysparm_input_display_value=true), as in
    # resolve-vulnerable-items.yml.
    snow_vi_resolved_state: Resolved

  tasks:
    # --- Satellite ----------------------------------------------------------

    - name: List the applicable errata of the host
      ansible.builtin.uri:
        url: >-
          {{ sat_api }}/api/hosts/{{ sat_host_id }}/errata?per_page=1000&search={{
          sat_errata_search | urlencode }}
        user: admin
        password: "{{ satellite_admin_password }}"
        force_basic_auth: true
        validate_certs: false
      register: sat_errata

    # CVE -> errata that fix it, severity, a title for the summary.
    - name: Collect the CVEs from the errata
      ansible.builtin.set_fact:
        sat_cve_details: >-
          {{ sat_cve_details | default({}) | combine({
               item.1.cve_id: {
                 'advisories': ((sat_cve_details | default({})).get(item.1.cve_id, {}).get('advisories', []) + [item.0.errata_id]) | unique,
                 'severity': item.0.severity | default('', true) or 'None',
                 'title': item.0.title | default(item.1.cve_id)
               }
             }) }}
      loop: "{{ sat_errata.json.results | subelements('cves', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.errata_id }} {{ item.1.cve_id }}"

    - name: Sort the CVEs
      ansible.builtin.set_fact:
        sat_cves: "{{ (sat_cve_details | default({})).keys() | list | sort }}"
        sat_cve_details: "{{ sat_cve_details | default({}) }}"

    # Hosts without CVEs still continue: their open items may need closing.
    - name: Stop for hosts without CVEs when nothing is closed
      ansible.builtin.meta: end_host
      when: sat_cves | length == 0 and not (snow_close_fixed_items | bool)

    # subscription-manager reports the SMBIOS serial as a fact; the CMDB CI
    # from register-cmdb-ci.yml is keyed on the same serial.
    - name: Read the host's serial number from Satellite
      ansible.builtin.uri:
        url: >-
          {{ sat_api }}/api/hosts/{{ sat_host_id }}/facts?per_page=50&search={{
          'name = dmi::system::serial_number' | urlencode }}
        user: admin
        password: "{{ satellite_admin_password }}"
        force_basic_auth: true
        validate_certs: false
      register: sat_facts

    - name: Remember the serial number
      ansible.builtin.set_fact:
        cmdb_serial: >-
          {{ (sat_facts.json.results | default({})).values() | map('dict2items') | flatten
             | selectattr('key', 'eq', 'dmi::system::serial_number') | map(attribute='value') | first | default('') }}

    # --- ServiceNow (same as sync-insights-cves.yml) -------------------------

    - name: Look up the CMDB CI (by serial, else by name)
      ansible.builtin.uri:
        url: >-
          {{ snow_api }}/{{ snow_cmdb_table }}?sysparm_limit=1&sysparm_fields=sys_id,name&sysparm_query={{
          (('serial_number=' ~ cmdb_serial) if cmdb_serial | length > 0 else ('name=' ~ inventory_hostname)) | urlencode }}
        headers: "{{ snow_headers }}"
      register: snow_ci
      failed_when: false
      no_log: true

    - name: Check ServiceNow answered
      ansible.builtin.assert:
        that: snow_ci.status == 200
        fail_msg: >-
          {{ 'ServiceNow rejected the API key (check the key and the API Access Policy).'
             if snow_ci.status == 401 else
             'The API key has no read access to ' ~ snow_cmdb_table ~ '.'
             if snow_ci.status == 403 else
             'CMDB lookup failed: HTTP ' ~ snow_ci.status }}
        quiet: true

    # A scheduled run should not fail on one host without a CI: report and skip.
    - name: Host has no CMDB CI yet
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: no {{ snow_cmdb_table }} CI with
          {{ ('serial ' ~ cmdb_serial) if cmdb_serial else ('name ' ~ inventory_hostname) }};
          skipped (run register-cmdb-ci.yml for it).
      when: snow_ci.json.result | length == 0

    - name: Skip hosts without a CI
      ansible.builtin.meta: end_host
      when: snow_ci.json.result | length == 0

    - name: Look up the vulnerability records of the CVEs
      ansible.builtin.uri:
        url: >-
          {{ snow_api }}/{{ snow_cve_table }}?sysparm_limit={{ snow_query_batch }}&sysparm_fields=sys_id,id&sysparm_query={{
          ('idIN' ~ item | join(',')) | urlencode }}
        headers: "{{ snow_headers }}"
      register: snow_cve_lookup
      loop: "{{ sat_cves | batch(snow_query_batch) | list }}"
      failed_when: false
      no_log: true

    - name: Create missing vulnerability records
      ansible.builtin.uri:
        url: "{{ snow_api }}/{{ snow_cve_table }}?sysparm_fields=sys_id,id"
        method: POST
        headers: "{{ snow_headers }}"
        body_format: json
        body:
          id: "{{ item }}"
          summary: "{{ sat_cve_details[item].title | truncate(4000) }}"
        status_code: 201
      register: snow_cve_created
      loop: "{{ sat_cves | difference(snow_cve_found | map(attribute='id')) }}"
      vars:
        snow_cve_found: "{{ snow_cve_lookup.results | selectattr('status', 'eq', 200) | map(attribute='json') | map(attribute='result') | flatten }}"
      when: snow_create_missing_cves | bool
      failed_when: false
      no_log: true

    - name: Map CVE ids to vulnerability records
      ansible.builtin.set_fact:
        snow_cve_ids: >-
          {{ dict(snow_cve_records | map(attribute='id') | zip(snow_cve_records | map(attribute='sys_id'))) }}
      vars:
        snow_cve_records: >-
          {{ (snow_cve_lookup.results | selectattr('status', 'eq', 200) | map(attribute='json') | map(attribute='result') | flatten)
             + (snow_cve_created.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'eq', 201)
                | map(attribute='json') | map(attribute='result') | list) }}

    - name: Check the vulnerability record lookups
      ansible.builtin.assert:
        that:
          - snow_cve_lookup.results | rejectattr('status', 'eq', 200) | list | length == 0
          - snow_cve_created.results | default([]) | selectattr('status', 'defined') | rejectattr('status', 'eq', 201) | list | length == 0
        fail_msg: >-
          Reading or creating {{ snow_cve_table }} records failed (403: no read or create
          access to {{ snow_cve_table }}; snow_create_missing_cves: false only reads): HTTP
          {{ (snow_cve_lookup.results + snow_cve_created.results | default([])) | selectattr('status', 'defined')
             | map(attribute='status') | reject('in', [200, 201]) | unique | join(', ') }}
        quiet: true

    - name: List the vulnerable items that already exist for the CI
      ansible.builtin.uri:
        url: >-
          {{ snow_api }}/{{ snow_vi_table }}?sysparm_limit=10000&sysparm_exclude_reference_link=true&sysparm_fields=sys_id,vulnerability&sysparm_query={{
          ('cmdb_ci=' ~ snow_ci.json.result[0].sys_id) | urlencode }}
        headers: "{{ snow_headers }}"
      register: snow_existing_vis
      failed_when: false
      no_log: true

    - name: Check the existing vulnerable items were read
      ansible.builtin.assert:
        that: snow_existing_vis.status == 200
        fail_msg: "Reading {{ snow_vi_table }} failed: HTTP {{ snow_existing_vis.status }} (does the API key's user have a Vulnerability Response role?)"
        quiet: true

    - name: Work out which vulnerable items are missing
      ansible.builtin.set_fact:
        vi_to_create: "{{ snow_cve_ids.keys() | difference(snow_cve_ids_with_vi) | sort }}"
      vars:
        snow_existing_vulns: "{{ snow_existing_vis.json.result | map(attribute='vulnerability') | list }}"
        snow_cve_ids_with_vi: >-
          {{ snow_cve_ids | dict2items | selectattr('value', 'in', snow_existing_vulns) | map(attribute='key') | list }}

    # ServiceNow can silently drop the vulnerability reference on insert (field
    # ACL, reference qualifier or business rule), which leaves an item linked
    # to nothing. Create one item first and read back what was stored, so a
    # dropped link stops the run instead of producing hundreds of orphans.
    - name: Create the first missing vulnerable item and check its link
      ansible.builtin.uri:
        url: >-
          {{ snow_api }}/{{ snow_vi_table }}?sysparm_exclude_reference_link=true&sysparm_fields=sys_id,number,vulnerability
        method: POST
        headers: "{{ snow_headers }}"
        body_format: json
        body:
          cmdb_ci: "{{ snow_ci.json.result[0].sys_id }}"
          vulnerability: "{{ snow_cve_ids[vi_to_create[0]] }}"
          work_notes: >-
            Reported by Red Hat Satellite for {{ inventory_hostname }}:
            fixed by {{ sat_cve_details[vi_to_create[0]].advisories | join(', ') }}
            (severity {{ sat_cve_details[vi_to_create[0]].severity }}), available in Satellite.
      register: snow_vi_probe
      when: vi_to_create | length > 0
      changed_when: snow_vi_probe.status | default(0) == 201
      failed_when: false
      no_log: true

    - name: Remove the test item when ServiceNow dropped its link
      ansible.builtin.uri:
        url: "{{ snow_api }}/{{ snow_vi_table }}/{{ snow_vi_probe.json.result.sys_id }}"
        method: DELETE
        headers: "{{ snow_headers }}"
        status_code: [200, 204]
      register: snow_vi_probe_delete
      when:
        - vi_to_create | length > 0
        - snow_vi_probe.status | default(0) == 201
        - snow_vi_probe.json.result.vulnerability | default('', true) == ''
      failed_when: false
      no_log: true

    - name: Stop when ServiceNow does not keep the vulnerability link
      ansible.builtin.fail:
        msg: >-
          ServiceNow created {{ snow_vi_probe.json.result.number }} but stored it without the
          vulnerability {{ vi_to_create[0] }} ({{ snow_cve_ids[vi_to_create[0]] }}), so the
          remaining {{ vi_to_create | length - 1 }} items were not created.
          {{ 'The test item was deleted.' if snow_vi_probe_delete.status | default(0) in [200, 204]
             else 'Delete it by hand (the API key cannot delete ' ~ snow_vi_table ~ ' records).' }}
          Check, as the API key's user, write access to {{ snow_vi_table }}.vulnerability
          (field ACL), its reference qualifier, and insert business rules on {{ snow_vi_table }}.
      when:
        - vi_to_create | length > 0
        - snow_vi_probe.status | default(0) == 201
        - snow_vi_probe.json.result.vulnerability | default('', true) == ''

    - name: Create the other missing vulnerable items
      ansible.builtin.uri:
        url: >-
          {{ snow_api }}/{{ snow_vi_table }}?sysparm_exclude_reference_link=true&sysparm_fields=sys_id,number,vulnerability
        method: POST
        headers: "{{ snow_headers }}"
        body_format: json
        body:
          cmdb_ci: "{{ snow_ci.json.result[0].sys_id }}"
          vulnerability: "{{ snow_cve_ids[item] }}"
          work_notes: >-
            Reported by Red Hat Satellite for {{ inventory_hostname }}:
            fixed by {{ sat_cve_details[item].advisories | join(', ') }}
            (severity {{ sat_cve_details[item].severity }}), available in Satellite.
      register: snow_vi_created
      # The first item was created (or failed) above.
      loop: "{{ vi_to_create[1:] if snow_vi_probe.status | default(0) == 201 else vi_to_create }}"
      changed_when: true
      failed_when: false
      no_log: true

    # --- Close what Satellite no longer reports -----------------------------

    - name: List the open vulnerable items of the CI
      ansible.builtin.uri:
        url: >-
          {{ snow_api }}/{{ snow_vi_table }}?sysparm_limit=10000&sysparm_exclude_reference_link=true&sysparm_fields=sys_id,number,vulnerability,vulnerability.id,vulnerability.sys_class_name,opened_at,sys_created_by&sysparm_query={{
          ('cmdb_ci=' ~ snow_ci.json.result[0].sys_id ~ '^active=true') | urlencode }}
        headers: "{{ snow_headers }}"
      register: snow_open_vis
      when: snow_close_fixed_items | bool
      failed_when: false
      no_log: true

    - name: Check the open vulnerable items were read
      ansible.builtin.assert:
        that: snow_open_vis.status == 200
        fail_msg: "Reading open {{ snow_vi_table }} records failed: HTTP {{ snow_open_vis.status }}"
        quiet: true
      when: snow_close_fixed_items | bool

    - name: Resolve the items Satellite no longer reports
      ansible.builtin.uri:
        url: >-
          {{ snow_api }}/{{ snow_vi_table }}/{{ item.sys_id }}?sysparm_input_display_value=true&sysparm_display_value=true&sysparm_fields=number,state
        method: PATCH
        headers: "{{ snow_headers }}"
        body_format: json
        body:
          state: "{{ snow_vi_resolved_state }}"
          work_notes: >-
            {{ ('Red Hat Satellite no longer reports ' ~ vid ~ ' for ' ~ inventory_hostname
                ~ ': the fixing erratum is installed')
               if vid else
               ('Not linked to any vulnerability record (the record it pointed to no longer exists); '
                ~ 'closed by the Satellite CVE sync for ' ~ inventory_hostname) }}
            (AAP job {{ tower_job_id | default('n/a') }}).
      register: snow_vi_closed
      # "vulnerability.id" is one key (dot-walked field), so test it per item;
      # selectattr would read the dot as a nested attribute.
      loop: "{{ snow_open_vis.json.result | default([]) }}"
      loop_control:
        label: "{{ item.number }} {{ item['vulnerability.id'] }}"
      vars:
        vid: "{{ item['vulnerability.id'] | default('', true) | upper }}"
        orphaned: "{{ (item['vulnerability.sys_class_name'] | default('', true)) == '' and vid == '' }}"
      when:
        - snow_close_fixed_items | bool
        - >-
          (vid is match('^CVE-') and vid not in sat_cves)
          or (orphaned | bool and snow_close_orphaned_items | bool)
      changed_when: snow_vi_closed.status | default(0) == 200
      failed_when: false
      no_log: true

    # What was not a CVE: closed as orphaned (no or dangling vulnerability
    # link) or left open (linked to a non-CVE vulnerability, e.g. an advisory
    # from another tool). Dot-walked fields are single keys, hence i[...].
    - name: Open items that are not linked to a CVE
      ansible.builtin.debug:
        msg:
          - "{{ not_cve | length }} open item(s) on the CI were not linked to a CVE."
          - "By kind: {{ not_cve | groupby('kind') | map('first') | zip(not_cve | groupby('kind') | map('last') | map('length')) | map('join', ': ') | list }}"
          - "By creator: {{ not_cve | groupby('creator') | map('first') | zip(not_cve | groupby('creator') | map('last') | map('length')) | map('join', ': ') | list }}"
          - "Examples (number | kind | opened): {{ not_cve[:10] | map(attribute='line') | list }}"
      vars:
        not_cve: >-
          {%- set out = [] -%}
          {%- for i in snow_open_vis.json.result | default([]) -%}
            {%- set vid = i['vulnerability.id'] | default('', true) -%}
            {%- set cls = i['vulnerability.sys_class_name'] | default('', true) -%}
            {%- set ref = i['vulnerability'] | default('', true) -%}
            {%- if not (vid | upper is match('^CVE-')) -%}
              {%- set kind = ('linked to ' ~ cls ~ ' ' ~ vid ~ ' (left open)') if cls
                             else ('dangling link (closed)' if ref else 'no link (closed)') -%}
              {%- if not cls and not (snow_close_orphaned_items | bool) -%}
                {%- set kind = kind | replace('(closed)', '(left open)') -%}
              {%- endif -%}
              {%- set _ = out.append({
                    'kind': kind,
                    'creator': i['sys_created_by'] | default('', true) or '(unknown)',
                    'line': i['number'] ~ ' | ' ~ kind ~ ' | ' ~ i['opened_at'] | default('') }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      when:
        - snow_close_fixed_items | bool
        - not_cve | length > 0

    - name: Report the result
      ansible.builtin.assert:
        that: vi_failed | length == 0
        fail_msg: >-
          {{ vi_failed | length }} vulnerable item(s) could not be created or resolved
          (HTTP {{ vi_failed | map(attribute='status') | unique | join(', ') }}; a 200 on a
          resolve means a business rule, ACL or missing role kept the old state):
          {{ ((vi_failed | map(attribute='item', default=vi_to_create[0] | default('')) | select('string') | list)
              + (vi_failed | map(attribute='item', default='') | reject('string') | map(attribute='number') | list))
             | join(', ') | truncate(500) }}
        success_msg: >-
          {{ inventory_hostname }}: {{ sat_cves | length }} CVEs with a fix in Satellite,
          {{ vi_created | length }} vulnerable items created,
          {{ vi_closed | length }} resolved because Satellite no longer reports them{{
          (' (' ~ vi_closed | map(attribute='item.number') | join(', ') ~ ')') if vi_closed else '' }},
          {{ snow_cve_ids | length - vi_to_create | default([]) | length }} already existed,
          {{ cve_records_created | length }} {{ snow_cve_table }} records created,
          {{ cves_skipped | length }} skipped (no {{ snow_cve_table }} record){{
          (': ' ~ cves_skipped | join(', ')) if cves_skipped else '' }}.
      vars:
        vi_all_creates: "{{ ([snow_vi_probe] if snow_vi_probe.status is defined else []) + snow_vi_created.results }}"
        vi_created: >-
          {{ vi_all_creates | selectattr('status', 'eq', 201)
             | selectattr('json.result.vulnerability', 'truthy') | list }}
        # Resolved = API 200 and the stored state really is the resolved one.
        vi_close_results: "{{ snow_vi_closed.results | default([]) | selectattr('status', 'defined') | list }}"
        vi_closed: >-
          {{ vi_close_results | selectattr('status', 'eq', 200)
             | selectattr('json.result.state', 'eq', snow_vi_resolved_state) | list }}
        vi_failed: >-
          {{ vi_all_creates | reject('in', vi_created) | list
             + vi_close_results | reject('in', vi_closed) | list }}
        cves_skipped: "{{ sat_cves | difference(snow_cve_ids.keys()) }}"
        cve_records_created: >-
          {{ snow_cve_created.results | default([]) | selectattr('status', 'defined')
             | selectattr('status', 'eq', 201) | list }}
