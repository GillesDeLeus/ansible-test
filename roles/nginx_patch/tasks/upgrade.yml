---
# No kubeconfig/host/api_key: helm and the kubernetes client fall back to the
# service account token mounted in the AAP job pod.
# atomic rolls the release back by itself if the rollout does not become ready.
- name: Upgrade the release to the patched image
  kubernetes.core.helm:
    name: "{{ nginx_patch_release_name }}"
    release_namespace: "{{ nginx_patch_namespace }}"
    chart_ref: "{{ nginx_patch_chart_ref }}"
    chart_repo_url: "{{ nginx_patch_chart_repo_url | default(omit, true) }}"
    chart_version: "{{ nginx_patch_target_chart_version }}"
    release_values: >-
      {{ nginx_patch_current_values
         | combine(nginx_patch_value_overrides, recursive=true) }}
    create_namespace: false
    atomic: true
    wait: true
    wait_timeout: "{{ nginx_patch_rollout_timeout }}"
  register: nginx_patch_upgrade
