---
# Set a ServiceNow remediation task to Resolved. ServiceNow then resolves the
# task's vulnerable items itself; with vulnerable_item_sys_id the playbook
# checks that it did. To resolve vulnerable items one by one instead, use
# resolve-vulnerable-items.yml.
#
# Imported at the end of cve-remediation.yaml, so the job ServiceNow launches
# resolves the task once the remediation succeeded. Can also run on its own.
#
# Job template requirements (see README):
#   - Credential: custom "ServiceNow" (aap/credential-type-servicenow.yml)
#     -> SN_HOST / SN_API_KEY env vars (REST API key, sent as x-sn-apikey)
#   - Extra vars:
#       remtask_sys_id: sys_id of the remediation task
#       vulnerable_item_sys_id (or vulnerable_item_sys_ids): optional, the
#         task's vulnerable items (comma-separated string or list), checked
#         to be resolved afterwards
# ServiceNow access: the API Access Policy must cover the Table API
# GET/PATCH /now/table/{tableName}/{sys_id} for the remediation task table,
# and GET /now/table/{tableName} for sn_vul_vulnerable_item when the items are
# checked; the user needs write access to the task (e.g. sn_vul.remediation_owner).

- name: Resolve a remediation task
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    snow_host: "{{ lookup('ansible.builtin.env', 'SN_HOST') | trim | regex_replace('/+$', '') }}"
    snow_api_key: "{{ lookup('ansible.builtin.env', 'SN_API_KEY') | trim }}"
    snow_headers:
      Accept: application/json
      x-sn-apikey: "{{ snow_api_key }}"
    remtask_sys_id: ""
    snow_remtask_table: sn_vul_vulnerability
    snow_remtask_url: "{{ snow_host }}/api/now/table/{{ snow_remtask_table }}/{{ remtask_sys_id | trim | lower }}"
    # Choice label, not number (sysparm_input_display_value=true).
    snow_remtask_resolved_state: Resolved
    snow_remtask_work_note: "Remediated by Ansible Automation Platform (job {{ tower_job_id | default('n/a') }})."
    # Check of the vulnerable items afterwards: states that count as done, and
    # how long to wait for ServiceNow to resolve them (it may do so async).
    snow_vi_verify: true
    snow_vi_table: sn_vul_vulnerable_item
    snow_vi_api: "{{ snow_host }}/api/now/table/{{ snow_vi_table }}"
    snow_vi_done_states: [Resolved, Closed]
    snow_vi_verify_retries: 12
    snow_vi_verify_delay: 10
    # sys_ids per lookup call: 100 keeps the URL around 3.5 KB.
    snow_query_batch: 100
    vi_sys_id_input: "{{ vulnerable_item_sys_ids | default(vulnerable_item_sys_id | default([])) }}"
    vi_sys_id_list: >-
      {{ (vi_sys_id_input if vi_sys_id_input is not string
          else vi_sys_id_input | split(',') | map('split') | flatten)
         | map('trim') | reject('eq', '') | map('lower') | unique | list }}

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - remtask_sys_id | trim | lower is match('^[0-9a-f]{32}$')
          - vi_sys_id_list | reject('match', '^[0-9a-f]{32}$') | list | length == 0
          - snow_host | length > 0
          - snow_api_key | length > 0
        fail_msg: >-
          Set remtask_sys_id (32 hex characters), optionally vulnerable_item_sys_id
          (comma-separated sys_ids), and attach the ServiceNow credential.
        quiet: true

    # The API key is a plain header, which Ansible does not mask, so the API
    # calls are no_log and the asserts after them report errors instead.
    - name: Read the remediation task
      ansible.builtin.uri:
        url: "{{ snow_remtask_url }}?sysparm_display_value=true&sysparm_fields=number,state"
        headers: "{{ snow_headers }}"
      register: remtask_before
      failed_when: false
      no_log: true

    - name: Check the remediation task was read
      ansible.builtin.assert:
        that: remtask_before.status == 200
        fail_msg: >-
          {{ 'No ' ~ snow_remtask_table ~ ' record with sys_id ' ~ remtask_sys_id
             ~ ' (wrong sys_id, or the task is in another table: set snow_remtask_table).'
             if remtask_before.status == 404 else
             'ServiceNow ignored the API key for ' ~ snow_remtask_table
             ~ ': the API Access Policy must cover the Table API GET/PATCH /now/table/{tableName}/{sys_id} for that table.'
             if remtask_before.status == 401 else
             'The API key has no read access to ' ~ snow_remtask_table ~ '.'
             if remtask_before.status == 403 else
             'Reading the remediation task failed: HTTP ' ~ remtask_before.status }}
        quiet: true

    - name: Set the remediation task to {{ snow_remtask_resolved_state }}
      ansible.builtin.uri:
        url: "{{ snow_remtask_url }}?sysparm_input_display_value=true&sysparm_display_value=true&sysparm_fields=number,state"
        method: PATCH
        headers: "{{ snow_headers }}"
        body_format: json
        body:
          state: "{{ snow_remtask_resolved_state }}"
          work_notes: "{{ snow_remtask_work_note }}"
      register: remtask_after
      when: remtask_before.json.result.state != snow_remtask_resolved_state
      changed_when: remtask_after.status | default(0) == 200
      failed_when: false
      no_log: true

    # Read back: ServiceNow can answer 200 and keep the state.
    - name: Report the remediation task
      ansible.builtin.assert:
        that: remtask_after.status == 200 and remtask_state == snow_remtask_resolved_state
        fail_msg: >-
          {{ remtask_number }} was not resolved:
          {{ ('HTTP ' ~ remtask_after.status ~ ' '
              ~ ('(the API Access Policy must cover PATCH /now/table/{tableName}/{sys_id} for ' ~ snow_remtask_table ~ ')'
                 if remtask_after.status == 401 else
                 '(no write access to ' ~ snow_remtask_table ~ ')' if remtask_after.status == 403 else '')
              ~ ' ' ~ remtask_error)
             if remtask_after.status != 200 else
             'still "' ~ remtask_state ~ '" (business rule, ACL, missing role, or "'
             ~ snow_remtask_resolved_state ~ '" is not a state of this table: set snow_remtask_resolved_state)' }}
        success_msg: "{{ remtask_number }} is now {{ snow_remtask_resolved_state }}."
      vars:
        # Both messages are templated whatever the outcome, and an error
        # response has no result, so nothing here may assume one.
        remtask_result: "{{ (remtask_after.json | default({})).result | default({}) }}"
        remtask_state: "{{ remtask_result.state | default('') if remtask_result is mapping else '' }}"
        remtask_number: "{{ remtask_before.json.result.number | default(remtask_sys_id) }}"
        remtask_error: >-
          {{ ((remtask_after.json | default({})).error | default({})).values() | select | join(': ')
             | default(remtask_after.msg | default(''), true) | string | truncate(300) }}
      when: remtask_after is not skipped

    - name: Report a remediation task that was already resolved
      ansible.builtin.debug:
        msg: "{{ remtask_before.json.result.number }} was already {{ snow_remtask_resolved_state }}."
      when: remtask_after is skipped

    # --- Vulnerable items ---------------------------------------------------

    # Resolving the task is expected to resolve its items; check it did,
    # waiting in case ServiceNow does it in the background.
    - name: Wait for ServiceNow to resolve the vulnerable items
      ansible.builtin.uri:
        url: >-
          {{ snow_vi_api }}?sysparm_limit={{ snow_query_batch }}&sysparm_display_value=true&sysparm_fields=sys_id,number,state&sysparm_query={{
          ('sys_idIN' ~ item | join(',')) | urlencode }}
        headers: "{{ snow_headers }}"
      register: snow_vis
      loop: "{{ vi_sys_id_list | batch(snow_query_batch) | list }}"
      loop_control:
        label: "{{ item | length }} sys_ids"
      until: >-
        snow_vis.status != 200
        or snow_vis.json.result | rejectattr('state', 'in', snow_vi_done_states) | list | length == 0
      retries: "{{ snow_vi_verify_retries }}"
      delay: "{{ snow_vi_verify_delay }}"
      failed_when: false
      no_log: true
      when: snow_vi_verify | bool and vi_sys_id_list | length > 0

    - name: Check the vulnerable items were resolved
      ansible.builtin.assert:
        that:
          - vi_read_failed | length == 0
          - vi_not_found | length == 0
          - vi_open | length == 0
        fail_msg: >-
          {{ ('Reading vulnerable items failed: HTTP ' ~ vi_read_failed | unique | join(', ')
              ~ (' (the API Access Policy must cover GET /now/table/{tableName} for ' ~ snow_vi_table ~ ')'
                 if 401 in vi_read_failed else ''))
             if vi_read_failed else
             (vi_open | length ~ ' of ' ~ vi_sys_id_list | length ~ ' vulnerable items are still open after '
              ~ (snow_vi_verify_retries | int * snow_vi_verify_delay | int) ~ 's: '
              ~ vi_open | map(attribute='number') | join(', ') | truncate(300)
              ~ ' (resolving the task through the API did not resolve them: run resolve-vulnerable-items.yml).')
             if vi_open else
             (vi_not_found | length ~ ' sys_ids are not readable ' ~ snow_vi_table ~ ' records: '
              ~ vi_not_found | join(', ') | truncate(300)) }}
        success_msg: >-
          All {{ vi_sys_id_list | length }} vulnerable items are
          {{ vi_records | map(attribute='state') | unique | join(' or ') }}.
      vars:
        vi_read_failed: "{{ snow_vis.results | map(attribute='status') | reject('eq', 200) | list }}"
        vi_records: "{{ snow_vis.results | selectattr('status', 'eq', 200) | map(attribute='json.result') | flatten }}"
        vi_open: "{{ vi_records | rejectattr('state', 'in', snow_vi_done_states) | list }}"
        vi_not_found: "{{ vi_sys_id_list | difference(vi_records | map(attribute='sys_id')) }}"
      when: snow_vis is not skipped