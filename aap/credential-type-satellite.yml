---
# Custom credential type "Red Hat Satellite", used by provision-satellite.yml,
# register-to-satellite.yml and satellite-demo.yml.
# Create in AAP: Automation Execution -> Infrastructure -> Credential Types -> Create.
# Paste "inputs" into "Input configuration" and "injectors" into
# "Injector configuration" (without the top-level key).
# Manifest field: base64 of the manifest .zip, e.g. `base64 -i manifest.zip | pbcopy`.
name: Red Hat Satellite
kind: cloud

inputs:
  fields:
    - id: admin_password
      type: string
      label: Satellite admin password
      secret: true
    - id: registry_username
      type: string
      label: registry.redhat.io username (or service account)
    - id: registry_password
      type: string
      label: registry.redhat.io password / token
      secret: true
    - id: manifest_b64
      type: string
      label: Subscription manifest (base64 of the .zip)
      secret: true
      multiline: true
  required:
    - admin_password
    - registry_username
    - registry_password
    - manifest_b64

injectors:
  extra_vars:
    satellite_admin_password: "{{ admin_password }}"
    registry_username: "{{ registry_username }}"
    registry_password: "{{ registry_password }}"
    satellite_manifest_b64: "{{ manifest_b64 }}"
