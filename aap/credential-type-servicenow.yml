---
# Custom credential type "ServiceNow", used by resolve-vulnerable-item.yml.
# Create in AAP: Automation Execution -> Infrastructure -> Credential Types -> Create.
# Paste the value of "inputs" into "Input configuration" and the value of
# "injectors" into "Injector configuration" (without the top-level key).
# The API key is a ServiceNow REST API key (System Web Services -> API Access
# Policies -> REST API Key), sent in the x-sn-apikey header.
name: ServiceNow
kind: cloud

inputs:
  fields:
    - id: instance
      type: string
      label: Instance URL
      help_text: https://<instance>.service-now.com
    - id: api_key
      type: string
      label: API key
      secret: true
  required:
    - instance
    - api_key

injectors:
  env:
    SN_HOST: "{{ instance }}"
    SN_API_KEY: "{{ api_key }}"
