---
# Custom credential type "Red Hat Activation Key", used by provision-vm.yml.
# Create in AAP: Automation Execution -> Infrastructure -> Credential Types -> Create.
# Paste the value of "inputs" into "Input configuration" and the value of
# "injectors" into "Injector configuration" (without the top-level key).
name: Red Hat Activation Key
kind: cloud

inputs:
  fields:
    - id: org_id
      type: string
      label: Organization ID
    - id: activation_key
      type: string
      label: Activation key
      secret: true
  required:
    - org_id
    - activation_key

injectors:
  extra_vars:
    rhc_org_id: "{{ org_id }}"
    rhc_activation_key: "{{ activation_key }}"
