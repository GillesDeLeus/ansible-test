---
# Custom credential type "Red Hat Service Account", used by sync-insights-cves.yml
# to read Insights inventory and vulnerability data from console.redhat.com.
# Create in AAP: Automation Execution -> Infrastructure -> Credential Types -> Create.
# Paste the value of "inputs" into "Input configuration" and the value of
# "injectors" into "Injector configuration" (without the top-level key).
# The service account (console.redhat.com -> Settings -> Service Accounts)
# needs a User Access group with the "Vulnerability viewer" and
# "Inventory Hosts viewer" roles.
name: Red Hat Service Account
kind: cloud

inputs:
  fields:
    - id: client_id
      type: string
      label: Client ID
    - id: client_secret
      type: string
      label: Client secret
      secret: true
  required:
    - client_id
    - client_secret

injectors:
  env:
    RH_CLIENT_ID: "{{ client_id }}"
    RH_CLIENT_SECRET: "{{ client_secret }}"
